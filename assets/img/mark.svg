     (branding/aryaai-brand-kit/app-icons/web/favicon.svg), which is the variant
     drawn for very small sizes. No embedded raster, so it stays crisp at 32px
     and costs ~1KB. Colors are the brand tokens, unchanged. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="aryaaiMarkTitle">
  <title id="aryaaiMarkTitle">AryaAI</title>
  <defs>
    <linearGradient id="aryaaiMarkFrame" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8A5CFF"/>
      <stop offset="0.32" stop-color="#2B6CFF"/>
      <stop offset="1" stop-color="#00E0D2"/>
    </linearGradient>
    <linearGradient id="aryaaiMarkLetter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6E8EB"/>
      <stop offset="1" stop-color="#E6E8EB" stop-opacity="0.72"/>
    </linearGradient>
  </defs>
  <path d="M188 446V392L90 336V144L256 48L422 144V336L324 392V446" fill="none" stroke="url(#aryaaiMarkFrame)" stroke-width="54" stroke-linejoin="miter"/>
