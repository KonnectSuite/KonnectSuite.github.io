releaseNotes: '{"en":["The Studio 5000 and MotionWorks engineering skills declare themselves user-invoked, so they stay out of the model''s tool catalog and load only when the user runs `/rockwell-l5x-engineering` or `/motionworks-iec-use`. Both bundles ship their newest releases with this change: dsh-tool-l5x 0.3.3 and MotionWorks 0.5.7.","Carries everything published as 0.12.2, 0.12.1, 0.12.0 and 0.11.0 for anyone updating from 0.10.1: the FactoryTalk View bundle at 0.1.7 that reports the version it actually ships, the Content studio with photo and video conversations, parsed Studio 5000 analysis with coordinated offline drafts and optional SDK-independent read-only PLC polling with live chat trends, and generation speed measured from the text that actually streamed."],"zh":["Studio 5000 与 MotionWorks 工程技能声明为由用户调用，因此不再出现在模型的工具目录中，只有用户执行 `/rockwell-l5x-engineering` 或 `/motionworks-iec-use` 时才会加载。两个组合包都以此改动发布各自的最新版本：dsh-tool-l5x 0.3.3 与 MotionWorks 0.5.7。","为从 0.10.1 升级的用户携带 0.12.2、0.12.1、0.12.0 与 0.11.0 发布的全部内容：报告自身实际版本、作为 0.1.7 的 FactoryTalk View 组合包，含图片与视频对话的内容工作室，Studio 5000 解析式项目分析与协同离线草稿、可选的独立于 SDK 的只读 PLC 轮询与实时对话趋势图，以及只按实际流式文本计量的生成速度。"]}'
