releaseNotes: '{"en":["Arya is now the built-in desktop pet, with English settings and a complete animated character.","ComfyUI Canvas and the official local ComfyUI MCP server are built in. Arya can edit workflows, run generations, monitor jobs, and collect outputs without a separate MCP installation.","Session cost estimates keep each provider and model separate when you switch models. Unknown rates are marked unpriced.","Updates are offered on their own. The installer shows its progress, then reopens AryaAI. Chats and settings stay.","A plan stays in the workspace, and opening it shows the plan beside the chat.","A DXF in the file tree opens as a drawing. Scroll to zoom and drag to pan.","Add skill sits beside Refresh, with Add server. The form asks when to use the skill and what to do.","Sign in to GitHub in Settings. Add workspace can clone a repository onto this PC and open it as a workspace.","No Repo sits above Ungrouped. A chat there has no workspace folder.","The slash menu has MCP. Turn a server on or off without leaving the chat, and the list stays open.","The header opens Changes, Browser, Terminal, and Files on the right. Press the open one again to close it.","Arya can read the text in a PDF: what the file is, its contents, a word search, and the pages you name. A scanned page stays empty.","The bottom left shows the GitHub name and picture. The menu signs in, signs out, and opens Settings.","Settings has Release notes. Each version is listed there, newest first."],"zh":["Arya 现在是内置桌面宠物，提供英文设置和完整的动画角色。","ComfyUI Canvas 和官方本地 ComfyUI MCP 服务器现已内置。无需另行安装 MCP，Arya 即可编辑工作流、运行生成任务、监控作业并收集输出。","会话费用估算在切换模型后分别保留各服务商和模型的用量，未知费率标为未计价。","更新会自己出现。安装程序会显示进度，然后重新打开 AryaAI。对话和设置会保留。","计划会留在工作区里，打开后显示在对话旁边。","文件树里的 DXF 会画成图纸。滚轮缩放，拖动平移。","添加技能在刷新旁边，和添加服务器同一位置。表单要写清什么时候用、具体怎么做。","设置里可以登录 GitHub。添加工作区可以把仓库克隆到这台电脑，并当作工作区打开。","无仓库在未分组上方。那里的对话没有工作区文件夹。","斜杠菜单里有 MCP。不用离开对话就能打开或关闭服务器，列表保持打开。","标题栏可以打开右侧的变更、浏览器、终端和文件。再按一次正在显示的那一项就会收起。","Arya 可以读 PDF 里的文字：文件信息、目录、按词搜索，以及你点名的页。扫描页没有文字。","左下角显示 GitHub 名字和头像。菜单可以登录、退出，以及打开设置。","设置里有版本说明。每个版本都列在那里，新的在前。"]}'
