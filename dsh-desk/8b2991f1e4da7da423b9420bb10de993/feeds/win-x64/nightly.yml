releaseNotes: '{"en":["Images opens a conversation room where Arya uses enabled ComfyUI MCP tools to choose image and video workflows. Reference photos, follow-up edits, saved conversations, recent runs and the local media library remain available alongside Advanced controls.","New image conversation creates a saved room immediately. Images can continue its Auto conversation when the separately configured ComfyUI controller is offline.","Skills & MCP exposes Windows Computer Use kill switch and dry run settings with Save and restart. The server checks every mutating tool path; read-only inspection remains available.","Safety controls wrap within their MCP card on narrow windows, and neighboring server cards keep independent heights."],"zh":["图片页面提供对话房间，Arya 通过已启用的 ComfyUI MCP 工具选择图片和视频工作流。参考图片、后续编辑、已保存对话、最近运行和本地媒体库与高级设置均保留。","新图片对话会立即创建并保存房间。单独配置的 ComfyUI 控制器离线时，图片页面仍可继续 Auto 对话。","技能与 MCP 提供 Windows Computer Use 的紧急停止和试运行设置，可保存并重启服务。服务端检查所有会修改桌面的工具调用，只读检查仍可使用。","窄窗口内的安全控件会在 MCP 卡片中换行，相邻服务器卡片保持独立高度。"]}'
