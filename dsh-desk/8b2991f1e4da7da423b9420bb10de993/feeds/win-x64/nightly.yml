releaseNotes: '{"en":["The MotionWorks IEC plugin is reliable. Adding a variable no longer fails because some other variable in the same program carries a mismatch between its declaration and its worksheet record — the mismatch is reported, and the edit goes through.","A program that declares none of the type you are adding borrows that record layout from another program in the same project, instead of refusing the edit.","Make and Build report what the compiler actually did. They previously reported a failure after 90 seconds on a project that was already compiled.","The IDE bridge waits for a MotionWorks window that is still starting, instead of refusing to open the project."],"zh":["MotionWorks IEC 插件现在稳定可靠。添加变量不再因为同一程序中另一个变量的声明与工作表记录不一致而失败——该不一致会被报告出来，编辑照常完成。","如果要添加的类型在目标程序中没有声明，会改为从同一项目的另一个程序借用该记录布局，而不是直接拒绝。","Make 和 Build 现在如实报告编译器的结果。此前对已经编译完成的项目，它们会在 90 秒后报告失败。","IDE 桥接会等待仍在启动中的 MotionWorks 窗口，而不是拒绝打开项目。"]}'
