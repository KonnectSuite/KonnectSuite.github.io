releaseNotes: '{"en":["Images uses a chat-style conversation with a persistent composer, inline generated media, recent runs below the chat and local media below recents. Advanced generation and media-management actions remain available.","Reference photos support multiple attachments, drag and drop, paste and individual removal. Follow-up messages use the Images agent instructions while preserving model, permission, dictation and stop controls.","ComfyUI connection settings support local or remote server addresses, connection testing and Save and reconnect. Image conversations and Advanced generation use the same configured endpoint; a shared output directory is optional.","Saved image conversations switch without releasing the displayed session early. Long transcripts scroll independently of the composer, including at laptop window sizes."],"zh":["图片页面采用聊天式对话，输入框始终可见，生成的媒体显示在对话中，最近运行位于聊天下方，本地媒体位于最近运行下方。高级生成和媒体管理功能均保留。","参考图片支持多附件、拖放、粘贴和逐项移除。后续消息使用图片代理指令，并保留模型、权限、语音输入和停止控件。","ComfyUI 连接设置支持本地或远程服务器地址、连接测试及保存后重新连接。图片对话和高级生成使用同一个配置地址，共享输出目录可选。","切换已保存的图片对话时，不再提前释放正在显示的会话。长对话可独立滚动，输入框在笔记本窗口尺寸下也保持可见。"]}'
