releaseNotes: '{"en":["Introduces the Content studio with photo and video conversations, reusable media references, search, and separate Studio and Library views.","Adds image editing, visual reference search, storyboards, timed scenes, saved LTX Director workflows, and film assembly through configured compatible ComfyUI workflows. Models and workflow dependencies require separate setup.","Updates Studio 5000 tools with parsed project analysis, symbol and logic inspection, and coordinated offline drafts. FactoryTalk Optix adds native authoring and preview inspection.","Adds optional SDK-independent, read-only PLC polling and live chat trends through Studio 5000 tools. Native polling is disabled by default; physical-controller performance remains unqualified.","Improves engineering browser sign-in and visible Playwright sessions, workspace projects, Native Window docking, and development launch reliability.","Restores the third-party community catalog alongside Arya plugins in Plugin Market. Updates preserve personal plugins and conversations.","LLM Control Center and the Local LLM Agent Preset remain separate plugins; local model weights and runtimes are not included in this installer."],"zh":["新增内容工作室，提供图片和视频对话、可复用媒体参考、搜索，以及独立的工作室和媒体库视图。","通过已配置的兼容 ComfyUI 工作流，新增图片编辑、视觉参考搜索、分镜、定时场景、已保存的 LTX Director 工作流和影片合成。模型与工作流依赖需要单独配置。","更新 Studio 5000 工具，支持解析项目分析、符号与逻辑检查，以及协同离线草稿。FactoryTalk Optix 新增原生创作与预览检查。","通过 Studio 5000 工具新增可选的独立于 SDK 的只读 PLC 轮询和实时对话趋势图。原生轮询默认关闭，实际控制器性能尚未验证。","改进工程浏览器登录、可见 Playwright 会话、工作区项目、Native Window 停靠和开发启动可靠性。","在插件市场中恢复第三方社区目录，并与 Arya 插件并列显示。更新保留个人插件和对话。","LLM 控制中心与本地 LLM 代理预设仍为独立插件；此安装包不包含本地模型权重和运行时。"]}'
