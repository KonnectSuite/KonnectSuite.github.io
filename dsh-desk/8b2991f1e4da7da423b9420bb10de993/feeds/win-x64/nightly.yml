releaseNotes: '{"en":["Updating a community plugin from the market now works on the desktop app. The official plugin manager refuses to install over an installed copy while hot reload is active, so the market removes that copy first and retries once; if the removal fails, its own error is what you see.","Carries everything published as 0.12.11: built-in plugins shipped at their source versions and updated with the installer, local checkouts that no longer hold built-in plugins back, and FactoryTalk Optix loading by default."],"zh":["桌面版现在可以从市场更新社区插件。官方插件管理器在热重载启用时拒绝直接覆盖已安装副本，因此市场会先移除该副本再重试一次；如果移除失败，则显示管理器自己的错误。","包含 0.12.11 发布的所有内容：按来源版本随安装程序更新的内置插件、不再拖住内置插件的本地副本，以及默认加载的 FactoryTalk Optix。"]}'
