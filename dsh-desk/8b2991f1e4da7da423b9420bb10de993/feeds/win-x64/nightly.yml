releaseNotes: '{"en":["Packaged installations launch the compression proxy from real files outside the application archive, so its separate Node process can start successfully.","Disabled capabilities remove their tools from model requests and block execution. Plugin and MCP tools load on demand, including tools from newly installed community plugins.","Compression controls stay available from the start. Compression gateways can reclaim the response allowance after fitting conversation history, so local reasoning models can finish their answers.","Local LLM Control Center remains an optional Plugin Market download and is not bundled with this installer.","The Plugins page groups plugins by who authors them: AryaAI plugins, which this installer ships or Plugin Market offers; DeepSeek Harness core; and community plugins built outside AryaAI. Each group carries a heading and one line saying what it means.","Bundles this installer ships and Plugin Market offers now sit together under AryaAI instead of being split between AryaAI and Community, and a plugin AryaAI authors that ships as a tool bundle is listed there too.","Carries everything published as 0.12.4, 0.12.3, 0.12.2, 0.12.1, 0.12.0 and 0.11.0 for anyone updating from 0.10.1: the newest pinned third-party bundles, every shipped plugin version as its own release for Plugin Market, the user-invoked Studio 5000 and MotionWorks engineering skills at 0.3.3 and 0.5.7, the FactoryTalk View bundle at 0.1.7 that reports the version it actually ships, the Content studio with photo and video conversations, parsed Studio 5000 analysis with coordinated offline drafts and optional SDK-independent read-only PLC polling with live chat trends, and generation speed measured from the text that actually streamed."],"zh":["安装版从应用归档之外的实际文件启动压缩代理，使其独立 Node 进程能够正常启动。","关闭功能后，其工具会从模型请求中移除，并禁止执行。插件与 MCP 工具按需加载，包括新安装的社区插件所提供的工具。","上下文压缩工具从会话开始即可使用。压缩网关可在调整对话历史后重新分配回复额度，使本地推理模型能够完成回答。","本地 LLM 控制中心仍是插件市场中的可选下载，不随本安装包提供。","插件页面现在按作者分组：由 AryaAI 开发的插件（随本安装包提供或由插件市场提供）、DeepSeek Harness 核心，以及由 AryaAI 之外的项目开发的社区插件。每组都有标题和一行说明其含义。","随本安装包提供与由插件市场提供的组合包现在都归入 AryaAI 分组，不再分散在 AryaAI 与社区两处；由 AryaAI 开发、以工具组合包形式随包提供的插件也列在其中。","为从 0.10.1 升级的用户携带 0.12.4、0.12.3、0.12.2、0.12.1、0.12.0 与 0.11.0 发布的全部内容：最新的固定第三方组合包，为插件市场把每个随包插件版本都作为独立发行版发布，由用户调用的 Studio 5000 与 MotionWorks 工程技能（0.3.3 与 0.5.7），报告自身实际版本、作为 0.1.7 的 FactoryTalk View 组合包，含图片与视频对话的内容工作室，Studio 5000 解析式项目分析与协同离线草稿、可选的独立于 SDK 的只读 PLC 轮询与实时对话趋势图，以及只按实际流式文本计量的生成速度。"]}'
