releaseNotes: '{"en":["Built-in AryaAI plugins now update with the application: a plugin version pinned in the profile that is older than the shipped copy is dropped when a release is prepared, so updating Arya moves the bundled plugins forward. Community and user-installed plugins keep whatever version their user chose, and a newer pin or a local development checkout still wins.","The Arya Plugin Market lists every AryaAI-authored plugin with the versions the installer ships, shows installer-shipped plugins as installed, and can update or restore installer-owned versions. The catalog is published with each release, so update versions no longer go missing between releases.","The bundled market is built from the Arya fork branch (1.66.14-arya.0.10), which is where catalog, version selection and restore-bundled-version behavior live.","FactoryTalk Optix loads by default as a built-in plugin, with its tools available without starting an external service.","Carries everything published as 0.12.8: the MCP Servers page with its Discover catalog, the retired Studio 5000/ignition/SCADA bridge MCP servers deleted, and bundled plugin titles and icons."],"zh":["内置 AryaAI 插件现在随应用一起更新：准备发布时，如果 profile 中固定的插件版本低于安装程序自带副本，该固定会被移除，因此更新 Arya 会把随包插件同步更新。社区插件与用户自行安装的插件保持用户选择的版本；更高版本或本地开发副本仍然优先。","Arya 插件市场列出每个 AryaAI 作者插件及安装程序自带的版本，将随安装包提供的插件显示为已安装，并可更新或恢复安装程序拥有的版本。插件目录随每次发布更新，更新版本不再在两次发布之间缺席。","随包插件市场由 Arya 分支构建（1.66.14-arya.0.10），目录、版本选择与恢复自带版本的行为都在该分支中。","FactoryTalk Optix 作为内置插件默认加载，工具可直接使用，无需启动外部服务。","包含 0.12.8 发布的所有内容：带“发现”目录的 MCP 服务器页面、已删除的 Studio 5000、Ignition 与 SCADA 桥接 MCP 服务器，以及随包插件的名称与图标。"]}'
