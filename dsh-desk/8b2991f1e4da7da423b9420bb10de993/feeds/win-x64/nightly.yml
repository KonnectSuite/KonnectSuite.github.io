releaseNotes: '{"en":["Ships the FactoryTalk View bundle as 0.1.6. Its browser half draws an exported ME display in the right sidebar file pane in place of its XML, and packaging now unpacks those browser resources with the engine, bridge, and skill. Analysis still requires Python with lxml 6.x, which the Desktop runtime includes.","Carries everything published as 0.12.0 and 0.11.0 for anyone updating from 0.10.1: the Content studio with photo and video conversations, parsed Studio 5000 analysis with coordinated offline drafts and optional SDK-independent read-only PLC polling with live chat trends, the Studio 5000 bundle republished from its merged main line as 0.3.2, and generation speed measured from the text that actually streamed."],"zh":["FactoryTalk View 组合包改为 0.1.6。其浏览器部分在右侧边栏文件窗格中直接绘制导出的 ME 画面，而不显示其 XML；打包时这些浏览器资源与引擎、桥接和技能一并解包。分析仍需 Python 与 lxml 6.x，Desktop 运行时已包含。","为从 0.10.1 升级的用户携带 0.12.0 与 0.11.0 发布的全部内容：含图片与视频对话的内容工作室、Studio 5000 解析式项目分析与协同离线草稿、可选的独立于 SDK 的只读 PLC 轮询与实时对话趋势图、从已合并主线重新发布为 0.3.2 的 Studio 5000 组合包，以及只按实际流式文本计量的生成速度。"]}'
