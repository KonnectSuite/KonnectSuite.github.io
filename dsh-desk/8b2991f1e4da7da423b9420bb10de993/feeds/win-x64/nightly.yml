releaseNotes: '{"en":["The Plugins page groups what is installed by where it comes from: AryaAI bundles this product ships, DeepSeek Harness core settings, and community plugins added on this machine. Each group carries a heading and one line saying what it means.","Pinned third-party bundles move to their newest releases: billion-context 0.1.197, dsh-plugin-guide 0.3.33, ds-harness-remote 0.5.8, and the image generation and Google Remote Desktop bundles at their newest commits.","Every plugin version this installer ships is published as its own release, so Plugin Market can install an earlier version again.","Carries everything published as 0.12.3, 0.12.2, 0.12.1, 0.12.0 and 0.11.0 for anyone updating from 0.10.1: the user-invoked Studio 5000 and MotionWorks engineering skills at 0.3.3 and 0.5.7, the FactoryTalk View bundle at 0.1.7 that reports the version it actually ships, the Content studio with photo and video conversations, parsed Studio 5000 analysis with coordinated offline drafts and optional SDK-independent read-only PLC polling with live chat trends, and generation speed measured from the text that actually streamed."],"zh":["插件页面按来源分组显示已安装的内容：本产品自带的 AryaAI 组合包、DeepSeek Harness 核心设置，以及在这台机器上添加的社区插件。每组都有标题和一行说明其含义。","固定的第三方组合包升级到各自最新版本：billion-context 0.1.197、dsh-plugin-guide 0.3.33、ds-harness-remote 0.5.8，以及图片生成与 Google 远程桌面组合包的最新提交。","本安装包携带的每个插件版本都作为独立发行版发布，因此插件市场可以再次安装较早的版本。","为从 0.10.1 升级的用户携带 0.12.3、0.12.2、0.12.1、0.12.0 与 0.11.0 发布的全部内容：由用户调用的 Studio 5000 与 MotionWorks 工程技能（0.3.3 与 0.5.7），报告自身实际版本、作为 0.1.7 的 FactoryTalk View 组合包，含图片与视频对话的内容工作室，Studio 5000 解析式项目分析与协同离线草稿、可选的独立于 SDK 的只读 PLC 轮询与实时对话趋势图，以及只按实际流式文本计量的生成速度。"]}'
