releaseNotes: '{"en":["AryaAI moves to DeepSeek Harness 0.2.1-rc.2, and every saved conversation stays readable.","Carries the product work the upgrade needed: the model picker gives each model its own child slot, the thinking controls follow the capability a model actually declares, Strata is offered as one plugin instead of a controller plus a preset, Windows upgrades replay cleanly, and web search setup and labels appear once per settings entry point.","Pinned third-party bundles are current as of this release: dsh-better-sidebar 0.28.0, dshmarket 1.66.14-arya.0.8, ds-harness-remote 0.5.13, dsh-plugin-guide 0.3.37, billion-context 0.1.201, and the image generation and Google Remote Desktop bundles at their newest commits.","Carries everything published as 0.12.5, 0.12.4, 0.12.3, 0.12.2, 0.12.1, 0.12.0 and 0.11.0 for anyone updating from 0.10.1: the Plugins page grouped by plugin authorship, every shipped plugin version published as its own release for Plugin Market, the user-invoked Studio 5000 and MotionWorks engineering skills at 0.3.3 and 0.5.7, the FactoryTalk View bundle at 0.1.7 that reports the version it actually ships, the Content studio with photo and video conversations, parsed Studio 5000 analysis with coordinated offline drafts and optional SDK-independent read-only PLC polling with live chat trends, and generation speed measured from the text that actually streamed."],"zh":["AryaAI 现在基于 DeepSeek Harness 0.2.1-rc.2，已保存的每个对话都仍可读取。","包含此次升级所需的产品改动：模型选择器为每个模型分配各自的子槽位，思考控制按模型实际声明支持的能力显示，Strata 以单个插件提供而不再是控制器加持设，Windows 升级可干净重放，网页搜索的设置与标签在同一设置入口只出现一次。","固定的第三方组合包在本次发布中均为最新版本：dsh-better-sidebar 0.28.0、dshmarket 1.66.14-arya.0.8、ds-harness-remote 0.5.13、dsh-plugin-guide 0.3.37、billion-context 0.1.201，以及图片生成与 Google 远程桌面组合包的最新提交。","为从 0.10.1 升级的用户携带 0.12.5、0.12.4、0.12.3、0.12.2、0.12.1、0.12.0 与 0.11.0 发布的全部内容：按插件作者分组的插件页面，为插件市场把每个随包插件版本都作为独立发行版发布，由用户调用的 Studio 5000 与 MotionWorks 工程技能（0.3.3 与 0.5.7），报告自身实际版本、作为 0.1.7 的 FactoryTalk View 组合包，含图片与视频对话的内容工作室，Studio 5000 解析式项目分析与协同离线草稿、可选的独立于 SDK 的只读 PLC 轮询与实时对话趋势图，以及只按实际流式文本计量的生成速度。"]}'
