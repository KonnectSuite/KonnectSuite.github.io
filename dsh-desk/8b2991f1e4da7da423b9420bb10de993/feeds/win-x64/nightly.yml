releaseNotes: '{"en":["MotionWorks IEC 0.5.1 adds engineering guides, fresh Build/Make verification after reopening, and reports that retain failed-step diagnostics.","The latest pinned Studio 5000 L5X update is bundled. Opening a workspace in Explorer now launches Windows File Explorer correctly.","The Images prompt supports dictation and reference-image editing, including Flux 2 Klein when its model files are installed. Local images and videos support bulk selection, ZIP download, and deletion.","ComfyUI MCP is enabled by default for new profiles. Existing explicit disable choices are preserved. The Images Auto conversation remains an opt-in preview."],"zh":["MotionWorks IEC 0.5.1 新增工程指南，重新打开项目后会执行新的 Build/Make 验证，报告也会保留失败步骤的诊断信息。","包含固定版本的最新 Studio 5000 L5X 更新。在资源管理器中打开工作区现在会正确启动 Windows 文件资源管理器。","图片提示词支持语音输入和参考图片编辑；安装相应模型后可使用 Flux 2 Klein。本地图片和视频支持批量选择、ZIP 下载和删除。","新配置默认启用 ComfyUI MCP，保留现有用户明确禁用的选择。图片 Auto 对话仍为需要主动启用的预览功能。"]}'
