releaseNotes: '{"en":["Corrects the version the FactoryTalk View bundle reports. Its engine kept its own copy of the number, which still said 0.1.4 after the 0.1.5 and 0.1.6 releases, so the workspace status and the exported change-package manifest named a version the bundle no longer had. The bundle now reads its released manifest and ships as 0.1.7.","The Skills page can switch a skill that a plugin registers at runtime off and on again. The registry owns that override now, so the skills manager, the tool catalog and the `/name` gesture read the same answer, and a skill a harness-owned package ships stays locked.","Carries everything published as 0.12.1, 0.12.0 and 0.11.0 for anyone updating from 0.10.1: the FactoryTalk View browser half that draws an exported ME display in the right sidebar file pane in place of its XML, the Content studio with photo and video conversations, parsed Studio 5000 analysis with coordinated offline drafts and optional SDK-independent read-only PLC polling with live chat trends, the Studio 5000 bundle at 0.3.2, and generation speed measured from the text that actually streamed."],"zh":["修正 FactoryTalk View 组合包报告的版本。其引擎保留了自身的版本号副本，在 0.1.5 与 0.1.6 发布后仍写着 0.1.4，导致工作区状态与导出的变更包清单标注了组合包已不再具备的版本。该组合包现在读取其发布清单，并作为 0.1.7 发布。","技能页面可以关闭插件在运行时注册的 skill 并重新开启。该覆盖现由注册表持有，因此技能管理器、工具目录与 `/name` 手势读取同一结论；由 harness 自带包提供的 skill 仍保持锁定。","为从 0.10.1 升级的用户携带 0.12.1、0.12.0 与 0.11.0 发布的全部内容：在右侧边栏文件窗格中直接绘制导出 ME 画面、替代其 XML 的 FactoryTalk View 浏览器部分，含图片与视频对话的内容工作室，Studio 5000 解析式项目分析与协同离线草稿，可选的独立于 SDK 的只读 PLC 轮询与实时对话趋势图，0.3.2 的 Studio 5000 组合包，以及只按实际流式文本计量的生成速度。"]}'
