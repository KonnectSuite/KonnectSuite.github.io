releaseNotes: '{"en":["Corrects the generation speed shown with a reply. A step that produced only tool-call arguments no longer counts toward generation time, so the reading reflects the text that actually streamed instead of an inflated figure.","Ships the Studio 5000 bundle rebuilt from its current source and re-released as 0.3.2. The archive 0.11.0 carried came from a branch that had not been merged, so that work now sits on the main line with the plugin''s newest tools, and the archive also carries the SDK-independent read-only PLC polling and live chat trends 0.11.0 introduced.","Registers the Studio 5000 engineering skill from its own file, so it can be switched off from the Skills page like other user-editable skills.","Compresses the bundled MotionWorks tool descriptions by about 8 percent of their prompt tokens, without changing any argument, precondition, refusal condition, or stated limit.","Fixes the Windows launcher so a build started from the installed application no longer fails on temporary-directory permissions."],"zh":["修正回复旁显示的生成速度。仅产出工具调用参数的步骤不再计入生成时间，读数反映实际流式输出的文本，而不是虚高的数值。","Studio 5000 组合包改用当前源码重新构建，并重新发布为 0.3.2。0.11.0 携带的归档来自一个尚未合并的分支，这些工作现已与该插件最新工具一同进入主线；该归档同时包含 0.11.0 引入的独立于 SDK 的只读 PLC 轮询与实时聊天趋势。","Studio 5000 工程技能改为从自身文件注册，因此可以像其他用户可编辑技能一样在技能页面上关闭。","压缩内置 MotionWorks 的工具描述，提示词 token 减少约 8%，未改变任何参数、前置条件、拒绝条件或已声明的限制。","修正 Windows 启动器，从已安装应用发起的构建不再因临时目录权限而失败。"]}'
