releaseNotes: '{"en":["Adds Arya Plugin Market with public packaged releases, plugin updates, and restoration of retained versions. FactoryTalk View Use and Native Window appear with Arya built-in plugins.","Updates Native Window to 0.2.2: Arya can inspect docked applications, accessible controls, text, dialogs and screenshots, then edit or invoke observed controls and verify the result.","Screenshot reasoning requires an image-capable model; text-only models use accessible controls and text. Foreground mouse and keyboard actions depend on Windows focus and access permissions.","Upgrades preserve sessions, personal plugins and removal of optional built-in bundles."],"zh":["新增 Arya 插件市场，提供公开打包的插件版本、插件更新及保留版本的恢复。FactoryTalk View Use 与 Native Window 显示在 Arya 内置插件分组中。","将 Native Window 更新至 0.2.2：Arya 可检查停靠应用、可访问控件、文本、对话框与截图，然后编辑或调用已观察的控件并验证结果。","截图推理需要支持图像的模型；纯文本模型使用可访问控件与文本。前台鼠标及键盘操作取决于 Windows 焦点与访问权限。","升级保留会话、个人插件及用户对可选内置 bundle 的移除。"]}'
