releaseNotes: '{"en":["Updates are offered on their own. The installer shows its progress, then reopens AryaAI. Chats and settings stay.","A plan stays in the workspace, and opening it shows the plan beside the chat.","A DXF in the file tree opens as a drawing. Scroll to zoom and drag to pan.","Add skill sits beside Refresh, with Add server. The form asks when to use the skill and what to do.","Sign in to GitHub in Settings. Add workspace can clone a repository onto this PC and open it as a workspace.","No Repo sits above Ungrouped. A chat there has no workspace folder.","The slash menu has MCP. Turn a server on or off without leaving the chat, and the list stays open."],"zh":["更新会自己出现。安装程序会显示进度，然后重新打开 AryaAI。对话和设置会保留。","计划会留在工作区里，打开后显示在对话旁边。","文件树里的 DXF 会画成图纸。滚轮缩放，拖动平移。","添加技能在刷新旁边，和添加服务器同一位置。表单要写清什么时候用、具体怎么做。","设置里可以登录 GitHub。添加工作区可以把仓库克隆到这台电脑，并当作工作区打开。","无仓库在未分组上方。那里的对话没有工作区文件夹。","斜杠菜单里有 MCP。不用离开对话就能打开或关闭服务器，列表保持打开。"]}'
